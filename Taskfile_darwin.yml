version: "3"

tasks:
  ensure-pdm:
    cmds:
      - pdm --version || curl -sSL https://pdm-project.org/install-pdm.py | python3 -

  ensure-deps:
    cmds:
      - HOMEBREW_NO_AUTO_UPDATE=1 brew install pkg-config multipass
      - task: ensure-pdm
    preconditions:
      - brew --version
    internal: true
    interactive: true # could ask for sudo
